<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1120 620"><title id="title">The common farthest-vertex method</title><desc id="desc">The same original vector supports additive whole-component energies and simultaneous references. Arithmetic adds field restrictions afterwards.</desc><rect width="1120" height="620" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173042} .title{font-size:26px;font-weight:700} .label{font-size:19px} .note{font-size:17px;fill:#4b6170} .small{font-size:16px} .arrow{fill:none;stroke:#326779;stroke-width:2.5;marker-end:url(#arrow)} .dash{fill:none;stroke:#7b8e96;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)} .box{stroke:#416272;stroke-width:1.7;rx:12}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#326779"/></marker></defs><text x="560" y="42" text-anchor="middle" class="title"><tspan x="560" dy="0">One original vector, one norm budget</tspan></text><rect class="box" x="285" y="75" width="550" height="90" fill="#eef5f8"/><text x="560.0" y="112.5" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Fix a strict interior point and a farthest vertex p</tspan><tspan x="560.0" dy="27">x ∈ p⊥,    ΣC ‖xC‖² = ‖x‖² &lt; 1</tspan></text><rect class="box" x="30" y="240" width="320" height="100" fill="#eef5f8"/><text x="190.0" y="269.0" text-anchor="middle" class="label"><tspan x="190.0" dy="0">Ordinary components</tspan><tspan x="190.0" dy="27">Uniform geometric costs</tspan><tspan x="190.0" dy="27">Actual defects charged once</tspan></text><rect class="box" x="400" y="240" width="320" height="100" fill="#eef5f8"/><text x="560.0" y="269.0" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Large A components</tspan><tspan x="560.0" dy="27">Chain coordinates, actual feet</tspan><tspan x="560.0" dy="27">Coupled reference vectors</tspan></text><rect class="box" x="770" y="240" width="320" height="100" fill="#eef5f8"/><text x="930.0" y="269.0" text-anchor="middle" class="label"><tspan x="930.0" dy="0">B/D components</tspan><tspan x="930.0" dy="27">Prefix and terminal-wall cases</tspan><tspan x="930.0" dy="27">D: both signed forks retained</tspan></text><path class="arrow" d="M400 165 L190 240"/><path class="arrow" d="M560 165 L560 240"/><path class="arrow" d="M720 165 L930 240"/><rect class="box" x="240" y="410" width="640" height="105" fill="#e8f5ef"/><text x="560.0" y="441.5" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Combine whole orthogonal component costs</tspan><tspan x="560.0" dy="27">Inside a component: pay each coefficient and retain all crosses</tspan><tspan x="560.0" dy="27">A total cost above 1 is impossible</tspan></text><path class="arrow" d="M190 340 L370 410"/><path class="arrow" d="M560 340 L560 410"/><path class="arrow" d="M930 340 L750 410"/><text x="560" y="565" text-anchor="middle" class="note"><tspan x="560" dy="0">Every auxiliary point must satisfy every original wall.</tspan><tspan x="560" dy="27">Arithmeticity later filters actual fields and parameters; it creates no second budget.</tspan></text></svg>

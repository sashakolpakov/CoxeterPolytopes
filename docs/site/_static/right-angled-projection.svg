<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1120 620"><title id="title">Right-angled dimension proof branches</title><desc id="desc">The general and ideal arguments share actual projection geometry, then use different code and metric inputs.</desc><rect width="1120" height="620" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173042} .title{font-size:26px;font-weight:700} .label{font-size:19px} .note{font-size:17px;fill:#4b6170} .small{font-size:16px} .arrow{fill:none;stroke:#326779;stroke-width:2.5;marker-end:url(#arrow)} .dash{fill:none;stroke:#7b8e96;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)} .box{stroke:#416272;stroke-width:1.7;rx:12}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#326779"/></marker></defs><text x="560" y="42" text-anchor="middle" class="title"><tspan x="560" dy="0">Right-angled dimensions: geometric descent and codes</tspan></text><rect class="box" x="305" y="75" width="510" height="90" fill="#eef5f8"/><text x="560.0" y="112.5" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Finite interior point; maximum-height facet</tspan><tspan x="560.0" dy="27">Actual positive projection satisfies every wall</tspan></text><rect class="box" x="40" y="240" width="470" height="115" fill="#eef5f8"/><text x="275.0" y="276.5" text-anchor="middle" class="label"><tspan x="275.0" dy="0">General finite-volume branch</tspan><tspan x="275.0" dy="27">Strict descent of the maximum facet height</tspan><tspan x="275.0" dy="27">Terminal six-variable spherical bound</tspan></text><rect class="box" x="610" y="240" width="470" height="115" fill="#eef5f8"/><text x="845.0" y="276.5" text-anchor="middle" class="label"><tspan x="845.0" dy="0">Entirely ideal branch</tspan><tspan x="845.0" dy="27">One actual projection</tspan><tspan x="845.0" dy="27">Four-dimensional code and facet/equality inputs</tspan></text><path class="arrow" d="M430 165 L275 240"/><path class="arrow" d="M690 165 L845 240"/><rect class="box" x="60" y="430" width="430" height="75" fill="#e8f5ef"/><text x="275.0" y="460.0" text-anchor="middle" class="label"><tspan x="275.0" dy="0">Strict endpoint excludes dimension 9</tspan><tspan x="275.0" dy="27">Dimension ≤ 8</tspan></text><rect class="box" x="630" y="430" width="430" height="75" fill="#e8f5ef"/><text x="845.0" y="460.0" text-anchor="middle" class="label"><tspan x="845.0" dy="0">Regular-24-cell metric obstruction at 5</tspan><tspan x="845.0" dy="27">Dimension ≤ 4</tspan></text><path class="arrow" d="M275 355 L275 430"/><path class="arrow" d="M845 355 L845 430"/><text x="560" y="560" text-anchor="middle" class="note"><tspan x="560" dy="0">Projection, real tensor/code arguments and named literature inputs are separate obligations.</tspan><tspan x="560" dy="27">The illustrated logic does not instantiate these geometric premises in Lean.</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1120 620"><title id="title">Finite57: common corner accounting</title><desc id="desc">Finite and ideal estimates share one nonnegative payment rule and meet in the global incidence contradiction.</desc><rect width="1120" height="620" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173042} .title{font-size:26px;font-weight:700} .label{font-size:19px} .note{font-size:17px;fill:#4b6170} .small{font-size:16px} .arrow{fill:none;stroke:#326779;stroke-width:2.5;marker-end:url(#arrow)} .dash{fill:none;stroke:#7b8e96;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)} .box{stroke:#416272;stroke-width:1.7;rx:12}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#326779"/></marker></defs><text x="560" y="42" text-anchor="middle" class="title"><tspan x="560" dy="0">One simultaneous corner-payment rule</tspan></text><rect class="box" x="330" y="75" width="460" height="80" fill="#eef5f8"/><text x="560.0" y="107.5" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Actual corners (v,F), weights w(v,F) ≥ 0</tspan><tspan x="560.0" dy="27">Keep every earlier obligation and debt</tspan></text><rect class="box" x="45" y="220" width="450" height="120" fill="#eef5f8"/><text x="270.0" y="259.0" text-anchor="middle" class="label"><tspan x="270.0" dy="0">Finite vertices</tspan><tspan x="270.0" dy="27">Complete spherical-forest domains</tspan><tspan x="270.0" dy="27">Same current rule bounds C(v)</tspan></text><rect class="box" x="625" y="220" width="450" height="120" fill="#eef5f8"/><text x="850.0" y="259.0" text-anchor="middle" class="label"><tspan x="850.0" dy="0">Ideal vertices</tspan><tspan x="850.0" dy="27">Affine product links and actual multiplicities</tspan><tspan x="850.0" dy="27">Same current rule supplies cusp surplus</tspan></text><path class="arrow" d="M430 155 L270 220"/><path class="arrow" d="M690 155 L850 220"/><rect class="box" x="265" y="405" width="590" height="105" fill="#e8f5ef"/><text x="560.0" y="436.5" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Count the same corner incidences both ways</tspan><tspan x="560.0" dy="27">ΣF Σv∈F w(v,F) = Σv C(v)</tspan><tspan x="560.0" dy="27">Face requirements versus vertex budgets</tspan></text><path class="arrow" d="M270 340 L410 405"/><path class="arrow" d="M850 340 L710 405"/><text x="560" y="555" text-anchor="middle" class="note"><tspan x="560" dy="0">Exact dimension 58 closes here; higher dimensions have separate tail arguments.</tspan><tspan x="560" dy="27">Arrows show proof dependencies, not geometric realizations or a fresh replay.</tspan></text></svg>

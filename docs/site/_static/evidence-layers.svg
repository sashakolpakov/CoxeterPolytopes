<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1120 640"><title id="title">Separate proof and publication evidence</title><desc id="desc">Written proof, exact computation and conditional Lean have distinct boundaries; PDF and documentation builds establish publication properties.</desc><rect width="1120" height="640" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173042} .title{font-size:26px;font-weight:700} .label{font-size:19px} .note{font-size:17px;fill:#4b6170} .small{font-size:16px} .arrow{fill:none;stroke:#326779;stroke-width:2.5;marker-end:url(#arrow)} .dash{fill:none;stroke:#7b8e96;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)} .box{stroke:#416272;stroke-width:1.7;rx:12}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#326779"/></marker></defs><text x="560" y="42" text-anchor="middle" class="title"><tspan x="560" dy="0">What each verification layer establishes</tspan></text><rect class="box" x="30" y="100" width="320" height="140" fill="#eef5f8"/><text x="190.0" y="135.5" text-anchor="middle" class="label"><tspan x="190.0" dy="0">Written mathematical argument</tspan><tspan x="190.0" dy="27">Geometry and domain coverage</tspan><tspan x="190.0" dy="27">Named external assumptions</tspan><tspan x="190.0" dy="27">Independent source review</tspan></text><rect class="box" x="400" y="100" width="320" height="140" fill="#eef5f8"/><text x="560.0" y="135.5" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Exact computation</tspan><tspan x="560.0" dy="27">Finite algorithm and correctness</tspan><tspan x="560.0" dy="27">Pinned inputs and actual output</tspan><tspan x="560.0" dy="27">Replay scope stated explicitly</tspan></text><rect class="box" x="770" y="100" width="320" height="140" fill="#eef5f8"/><text x="930.0" y="135.5" text-anchor="middle" class="label"><tspan x="930.0" dy="0">Conditional Lean kernel</tspan><tspan x="930.0" dy="27">Internal implication proved</tspan><tspan x="930.0" dy="27">Compilation and separate audit</tspan><tspan x="930.0" dy="27">Ordinary premises remain inputs</tspan></text><rect class="box" x="175" y="325" width="770" height="90" fill="#fff5e7"/><text x="560.0" y="362.5" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Source, script output and theorem parameters must refer to the same proposition</tspan><tspan x="560.0" dy="27">Hashes identify bytes; they do not prove coverage, geometry or a literature theorem</tspan></text><path class="dash" d="M190 240 L340 325"/><path class="dash" d="M560 240 L560 325"/><path class="dash" d="M930 240 L780 325"/><rect class="box" x="280" y="490" width="560" height="80" fill="#e8f5ef"/><text x="560.0" y="522.5" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Matching PDF + strict Sphinx + actual Git-index audit</tspan><tspan x="560.0" dy="27">Publication and deployment evidence</tspan></text><path class="dash" d="M560 415 L560 490"/><text x="560" y="600" text-anchor="middle" class="note"><tspan x="560" dy="0">Dashed arrows denote source/evidence bindings, not automatic mathematical validation.</tspan></text></svg>

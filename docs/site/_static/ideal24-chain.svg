<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1120 640"><title id="title">Scope of the restricted 24-cell chain theorem</title><desc id="desc">A general equality reduction precedes the Oct/D restricted cutting theorem; the two-cell case yields the second-volume double.</desc><rect width="1120" height="640" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173042} .title{font-size:26px;font-weight:700} .label{font-size:19px} .note{font-size:17px;fill:#4b6170} .small{font-size:16px} .arrow{fill:none;stroke:#326779;stroke-width:2.5;marker-end:url(#arrow)} .dash{fill:none;stroke:#7b8e96;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)} .box{stroke:#416272;stroke-width:1.7;rx:12}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#326779"/></marker></defs><text x="560" y="40" text-anchor="middle" class="title"><tspan x="560" dy="0">Ideal RA4: equality first, restricted decomposition second</tspan></text><rect class="box" x="290" y="70" width="540" height="85" fill="#eef5f8"/><text x="560.0" y="105.0" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Arbitrary finite-volume entirely ideal RA4 polytope</tspan><tspan x="560.0" dy="27">Volume gap and equality-spectrum reduction</tspan></text><rect class="box" x="85" y="220" width="950" height="265" fill="#f1f7f9"/><text x="560.0" y="372.0" text-anchor="middle" class="label"></text><text x="560" y="254" text-anchor="middle" class="label"><tspan x="560" dy="0">Restricted hypothesis: every facet is octahedral or doubled-octahedral</tspan></text><rect class="box" x="130" y="285" width="860" height="72" fill="#eef5f8"/><text x="560.0" y="327.0" text-anchor="middle" class="label"><tspan x="560.0" dy="0">Actual octahedral sections → legitimate cuts → whole-cell recognition</tspan></text><text x="560" y="391" text-anchor="middle" class="label"><tspan x="560" dy="0">No branching: opposite-cut obstruction and canonical gluing</tspan></text><rect class="box" x="190" y="412" width="120" height="52" fill="#e8f5ef"/><text x="250.0" y="444.0" text-anchor="middle" class="label"><tspan x="250.0" dy="0">C₁</tspan></text><rect class="box" x="435" y="412" width="120" height="52" fill="#e8f5ef"/><text x="495.0" y="444.0" text-anchor="middle" class="label"><tspan x="495.0" dy="0">C₂</tspan></text><rect class="box" x="825" y="412" width="120" height="52" fill="#e8f5ef"/><text x="885.0" y="444.0" text-anchor="middle" class="label"><tspan x="885.0" dy="0">Cₘ</tspan></text><text x="687" y="444" text-anchor="middle" class="title"><tspan x="687" dy="0">…</tspan></text><path class="arrow" d="M310 438 L435 438"/><path class="arrow" d="M555 438 L650 438"/><path class="arrow" d="M725 438 L825 438"/><path class="arrow" d="M560 155 L560 220"/><text x="580" y="193" text-anchor="start" class="small">at equality: 8π²/3</text><text x="560" y="537" text-anchor="middle" class="note"><tspan x="560" dy="0">Nodes denote whole regular ideal 24-cells; the graph is a chain.</tspan><tspan x="560" dy="27">At the second volume: exactly two cells, giving the unique reflected double.</tspan><tspan x="560" dy="27">No decomposition theorem for arbitrary ideal RA4 polytopes is asserted.</tspan></text></svg>

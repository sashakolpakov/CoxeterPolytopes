name: Documentation

# This workflow builds Sphinx only. It runs no proof checker, Lean, TeX, or
# bulk-data restoration. Publication starts only after an authorized push.
# Pages conventions: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Strict Sphinx build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: repro/requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r repro/requirements-docs.txt

      - name: Build documentation, treating warnings as errors
        run: python -m sphinx -W --keep-going -b html docs/site _build/site

      - name: Audit tracked publication files
        run: python tools/audit_public_tree.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/site

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
